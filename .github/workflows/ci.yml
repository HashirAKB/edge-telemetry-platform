name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm version from "packageManager"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: OpenAPI document is up to date
        run: pnpm openapi:check

      - name: CDK synth (no AWS credentials)
        run: pnpm synth

  image:
    name: Simulator image (build, size, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAX_IMAGE_BYTES: 250000000 # FR-SIM-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build -f packages/simulator/Dockerfile -t etp-simulator:ci .

      - name: Check size
        run: |
          size=$(docker image inspect etp-simulator:ci --format '{{.Size}}')
          echo "image size: $size bytes (limit $MAX_IMAGE_BYTES)"
          test "$size" -lt "$MAX_IMAGE_BYTES"

      - name: Smoke test (stdout transport, graceful stop)
        run: |
          docker run -d --name sim -e INTERVAL_MS=1000 etp-simulator:ci
          sleep 4
          docker stop -t 10 sim
          test "$(docker inspect sim --format '{{.State.ExitCode}}')" = 0
          test "$(docker logs sim 2>/dev/null | wc -l)" -ge 15

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the last commit

      # The CLI scans the whole history on every run. gitleaks-action scans only the pushed
      # range (`first^..head`), which breaks when a push includes the root commit.
      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
